{% extends "base.html" %}

{% block title %}New Character - D&D Character Manager{% endblock %}

{% block content %}
<div class="character-form-container">
    <h2>Create New Character</h2>
    <form method="POST" class="character-form">
        <div class="form-group">
            <label for="name">Character Name</label>
            <input type="text" id="name" name="name" required maxlength="100">
        </div>
        
        <div class="form-group">
            <label for="level">Level</label>
            <input type="number" id="level" name="level" min="1" max="20" value="1" required>
        </div>
        
        <h3>Ability Scores & Proficiency</h3>
        <p class="form-hint">Check the box next to a stat to add your proficiency bonus</p>
        
        <div class="stats-grid with-proficiency">
            <div class="stat-field">
                <label for="strength">Strength</label>
                <input type="number" id="strength" name="strength" min="1" max="30" value="10" required>
                <label class="proficiency-checkbox">
                    <input type="checkbox" name="str_proficient"> Proficient
                </label>
            </div>
            <div class="stat-field">
                <label for="dexterity">Dexterity</label>
                <input type="number" id="dexterity" name="dexterity" min="1" max="30" value="10" required>
                <label class="proficiency-checkbox">
                    <input type="checkbox" name="dex_proficient"> Proficient
                </label>
            </div>
            <div class="stat-field">
                <label for="constitution">Constitution</label>
                <input type="number" id="constitution" name="constitution" min="1" max="30" value="10" required>
                <label class="proficiency-checkbox">
                    <input type="checkbox" name="con_proficient"> Proficient
                </label>
            </div>
            <div class="stat-field">
                <label for="intelligence">Intelligence</label>
                <input type="number" id="intelligence" name="intelligence" min="1" max="30" value="10" required>
                <label class="proficiency-checkbox">
                    <input type="checkbox" name="int_proficient"> Proficient
                </label>
            </div>
            <div class="stat-field">
                <label for="wisdom">Wisdom</label>
                <input type="number" id="wisdom" name="wisdom" min="1" max="30" value="10" required>
                <label class="proficiency-checkbox">
                    <input type="checkbox" name="wis_proficient"> Proficient
                </label>
            </div>
            <div class="stat-field">
                <label for="charisma">Charisma</label>
                <input type="number" id="charisma" name="charisma" min="1" max="30" value="10" required>
                <label class="proficiency-checkbox">
                    <input type="checkbox" name="cha_proficient"> Proficient
                </label>
            </div>
        </div>
        
        <p class="form-hint">Stats must be between 1 and 30</p>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Create Character</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
