{% extends "base.html" %}

{% block title %}Import Character - D&D Character Manager{% endblock %}

{% block content %}
<div class="character-form-container">
    <h2>Import Character</h2>
    <p class="form-hint">Upload a JSON file exported from this application to create a new character.</p>
    
    <form method="POST" enctype="multipart/form-data" class="character-form">
        <div class="form-group">
            <label for="file">JSON File</label>
            <input type="file" id="file" name="file" accept=".json" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Import Character</button>
            <a href="{{ url_for('routes.dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
